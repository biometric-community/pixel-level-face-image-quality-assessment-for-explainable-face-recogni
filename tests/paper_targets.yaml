# Terhoerst, Huber, Damer, Kirchbuchner, Raja & Kuijper, "Pixel-Level Face Image Quality
# Assessment for Explainable Face Recognition", IEEE TBIOM 5(2), 2023,
# doi:10.1109/TBIOM.2023.3263186, arXiv:2110.11001.
